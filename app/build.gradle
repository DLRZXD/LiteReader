plugins {
    id 'com.android.application'
}

android {
    namespace 'com.litereader.offline'
    compileSdk 35

    defaultConfig {
        applicationId "com.litereader.offline"
        minSdk 26
        targetSdk 35
        versionCode 51
        versionName "6.9.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
        debug {
            applicationIdSuffix ".debug"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
}
